name: Update profile art

# Refreshes the commit-activity graph SVG daily from real data
# (GitHub REST API only -- no scraping, no third-party services).
# Runs daily, plus whenever you push to main, plus on-demand.

"on":
  schedule:
    - cron: "23 6 * * *"   # ~06:23 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

# a scheduled run overlapping a push-triggered run would race the
# auto-commit push; keep one refresh in flight at a time
concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # both scripts are stdlib-only; no pip install needed

      - name: Aggregate commit activity from the GitHub API
        run: python scripts/fetch_commit_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render animated commit-activity SVG
        run: python scripts/generate_streak_svg.py data/commit-activity.json contrib-heatmap.svg

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh commit-activity graph [skip ci]"
          file_pattern: "data/commit-activity.json contrib-heatmap.svg"
